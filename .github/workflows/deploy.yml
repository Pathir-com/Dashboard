name: Deploy Dashboard + Supabase

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: "Deploy every edge function and run every migration, ignoring git diff"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Frontend: build + deploy to GitHub Pages ──
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://amxcposgqlmgapzoopze.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFteGNwb3NncWxtZ2Fwem9vcHplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMDU3MTksImV4cCI6MjA4ODU4MTcxOX0.neGu5-OeiQVoNDV-ABZJ09fuR_BJwHvXavfyrHZorOk
          VITE_META_APP_ID: ${{ secrets.META_APP_ID }}
      - run: cp dist/index.html dist/404.html
      - run: echo "app.pathir.com" > dist/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ── Supabase: deploy edge functions + run new migrations ──
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Sync edge-function secrets from GitHub Actions secrets.
      # Skips any whose GH secret is empty so half-configured providers don't
      # blank an existing good value in Supabase.
      - name: Sync edge function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TEXTMAGIC_USERNAME: ${{ secrets.TEXTMAGIC_USERNAME }}
          TEXTMAGIC_API_KEY: ${{ secrets.TEXTMAGIC_API_KEY }}
        run: |
          PROJECT_REF="amxcposgqlmgapzoopze"
          PAIRS=()
          if [ -n "$TEXTMAGIC_USERNAME" ]; then
            PAIRS+=("TEXTMAGIC_USERNAME=$TEXTMAGIC_USERNAME")
          fi
          if [ -n "$TEXTMAGIC_API_KEY" ]; then
            PAIRS+=("TEXTMAGIC_API_KEY=$TEXTMAGIC_API_KEY")
          fi
          if [ ${#PAIRS[@]} -gt 0 ]; then
            supabase secrets set "${PAIRS[@]}" --project-ref "$PROJECT_REF"
            echo "Synced ${#PAIRS[@]} secret(s) to Supabase."
          else
            echo "No secrets to sync (none set in GitHub)."
          fi

      # Deploy every edge function whose directory changed in this push.
      # Two escape hatches when diff misses files (history rewrite, bootstrap):
      #   - workflow_dispatch with deploy_all=true
      #   - include "[deploy-all]" anywhere in the head commit message
      - name: Deploy changed edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEPLOY_ALL: ${{ inputs.deploy_all }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          PROJECT_REF="amxcposgqlmgapzoopze"

          FORCE_ALL="false"
          if [ "$DEPLOY_ALL" = "true" ]; then FORCE_ALL="true"; fi
          if echo "$HEAD_MSG" | grep -q '\[deploy-all\]'; then FORCE_ALL="true"; fi

          if [ "$FORCE_ALL" = "true" ]; then
            CHANGED=$(find supabase/functions -type f -name "*.ts" 2>/dev/null)
            echo "Force-deploy triggered — deploying every function."
          else
            # Diff against the commit main was at BEFORE this push (covers
            # multi-commit pushes — HEAD~1 would miss the earlier commits).
            BEFORE="$PUSH_BEFORE"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"  # fallback for initial push
            fi
            CHANGED=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || echo "")
            echo "Comparing $BEFORE..HEAD"
          fi

          for fn_dir in supabase/functions/*/index.ts; do
            fn_name=$(echo "$fn_dir" | sed 's|supabase/functions/||; s|/index.ts||')

            # Skip shared helpers directory
            if [ "$fn_name" = "_shared" ]; then continue; fi

            # Deploy if function code or shared helpers changed
            if echo "$CHANGED" | grep -qE "^supabase/functions/($fn_name|_shared)/"; then
              echo "Deploying $fn_name..."
              # External webhooks (ElevenLabs, Chatbase, Meta, Twilio) call without JWT
              NO_JWT_FUNCTIONS="elevenlabs-tool elevenlabs-conversation elevenlabs-webhook chatbase-action chatbase-webhook chatbase-save meta-webhook meta-connect twilio-sms-webhook twilio-disconnected-voice textmagic-webhook textmagic-status send-reminders chat-token"
              if echo "$NO_JWT_FUNCTIONS" | grep -qw "$fn_name"; then
                supabase functions deploy "$fn_name" --no-verify-jwt --project-ref "$PROJECT_REF"
              else
                supabase functions deploy "$fn_name" --project-ref "$PROJECT_REF"
              fi
            fi
          done

          echo "Edge function deployment complete."

      # Run any new migration SQL files added in this push
      - name: Run new migrations
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEPLOY_ALL: ${{ inputs.deploy_all }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          PROJECT_REF="amxcposgqlmgapzoopze"

          FORCE_ALL="false"
          if [ "$DEPLOY_ALL" = "true" ]; then FORCE_ALL="true"; fi
          if echo "$HEAD_MSG" | grep -q '\[deploy-all\]'; then FORCE_ALL="true"; fi

          if [ "$FORCE_ALL" = "true" ]; then
            CHANGED=$(find supabase/migrations -type f -name "*.sql" 2>/dev/null)
          else
            BEFORE="$PUSH_BEFORE"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            CHANGED=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || echo "")
          fi

          for sql_file in $(echo "$CHANGED" | grep '^supabase/migrations/.*\.sql$' | sort); do
            if [ -f "$sql_file" ]; then
              echo "Running migration: $sql_file"
              supabase db query --linked < "$sql_file" || echo "⚠️  Migration had errors (may already be applied)"
            fi
          done

          echo "Migration deployment complete."
